<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Wish - Wishing Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-darker: #050810;
            --primary: #4fc3f7;
            --primary-glow: rgba(79, 195, 247, 0.4);
            --secondary: #ffa726;
            --accent: #9c27b0;
            --text: #e0e6ed;
            --text-dim: #8892a6;
            --border: rgba(79, 195, 247, 0.2);
            --grid-bg: rgba(15, 20, 35, 0.6);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-darker);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(79, 195, 247, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(156, 39, 176, 0.1) 0%, transparent 50%);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px var(--primary-glow);
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-dim);
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }

        .main-content {
            display: grid;
            grid-template-columns: 900px 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
            align-items: start;
        }

        .wall-section {
            background: var(--grid-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .instruction-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .wishing-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: rgba(5, 8, 16, 0.9);
            border: 6px solid rgba(79, 195, 247, 0.3);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-cell::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, rgba(79, 195, 247, 0.4), rgba(156, 39, 176, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-cell:hover::before {
            opacity: 1;
        }

        .grid-cell:hover {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
            transform: scale(1.08);
        }

        .grid-cell.active {
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px rgba(79, 195, 247, 0.2);
            background: rgba(15, 25, 40, 0.95);
        }

        .grid-cell.active::before {
            opacity: 1;
        }

        .symbol-display {
            width: 100%;
            height: 100%;
            filter: brightness(0.9) drop-shadow(0 0 4px rgba(79, 195, 247, 0.5));
            transition: filter 0.3s ease;
        }

        .grid-cell:hover .symbol-display,
        .grid-cell.active .symbol-display {
            filter: brightness(1.3) drop-shadow(0 0 8px var(--primary));
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .reset-button {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(15, 25, 40, 0.95), rgba(5, 8, 16, 0.9));
            border: 6px solid rgba(255, 167, 38, 0.4);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            line-height: 1.2;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .reset-button::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, rgba(255, 167, 38, 0.6), rgba(255, 87, 34, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .reset-button:hover {
            border-color: var(--secondary);
            box-shadow: 0 0 30px rgba(255, 167, 38, 0.5);
            transform: scale(1.1);
        }

        .reset-button:hover::before {
            opacity: 1;
        }

        .reset-button:active {
            transform: scale(0.95);
        }

        .wishes-list {
            background: var(--grid-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            max-height: 800px;
            overflow-y: auto;
        }

        .wishes-list::-webkit-scrollbar {
            width: 8px;
        }

        .wishes-list::-webkit-scrollbar-track {
            background: rgba(10, 14, 26, 0.5);
            border-radius: 4px;
        }

        .wishes-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .wishes-list::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        .wish-item {
            background: rgba(10, 14, 26, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wish-item:hover {
            border-color: var(--primary);
            background: rgba(79, 195, 247, 0.05);
            transform: translateX(8px);
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .wish-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .wish-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text);
        }

        .wish-description {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 0.5rem;
        }

        .mystery {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-style: italic;
        }

        @media (max-width: 1400px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .wall-section {
                max-width: 900px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
                letter-spacing: 0.15rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .wishing-grid {
                gap: 0.8rem;
                padding: 0.5rem;
            }
            
            .grid-cell {
                border-width: 4px;
            }
            
            .container {
                padding: 1rem;
            }
            
            .main-content {
                gap: 2rem;
            }
            
            .reset-button {
                width: 70px;
                height: 70px;
                font-size: 0.65rem;
            }
            
            .wall-section {
                max-width: 100%;
            }
        }

        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(79, 195, 247, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Symbol positions in the atlas (4x4 grid)
        const SYMBOLS = [
            { id: 0,  name: 'Fish',             row: 0, col: 0 },
            { id: 1,  name: 'Dragon',           row: 0, col: 1 },
            { id: 2,  name: 'Snake Circle',     row: 0, col: 2 },
            { id: 3,  name: 'Bird Dragon',      row: 0, col: 3 },
            { id: 4,  name: 'Infinity Snake',   row: 1, col: 0 },
            { id: 5,  name: 'Double Snake',     row: 1, col: 1 },
            { id: 6,  name: 'S Snake',          row: 1, col: 2 },
            { id: 7,  name: 'Spiral',           row: 1, col: 3 },
            { id: 8,  name: 'Winged Dragon',    row: 2, col: 0 },
            { id: 9,  name: 'Standing Dragon',  row: 2, col: 1 },
            { id: 10, name: 'Split Dragon',     row: 2, col: 2 },
            { id: 11, name: 'Sword Dragon',     row: 2, col: 3 },
            { id: 12, name: 'Griffin',          row: 3, col: 0 },
            { id: 13, name: 'Owl',              row: 3, col: 1 },
            { id: 14, name: 'Eagle Head',       row: 3, col: 2 },
            { id: 15, name: 'Eagle',            row: 3, col: 3 },
            { id: 16, name: 'Riven',            row: 4, col: 4 }
        ];

        const WISHES = [
            {
                number: 1,
                title: "Grants an etherial key, used in raid treasure room.",
                description: "A wish to feed an addiction.",
                pattern: [
                       0,    0,   13,   13,   13,
                       0,    0, null,   13,   13,
                       5,    5, null,    3,    3,
                       5,    5,    9,    3,    3]
            },
            {
                number: 2,
                title: "Spawns chest between third and fourth encounters.",
                description: "A wish for material validation.",
                pattern: [
                       3, null,   10, null,    2,
                       3, null,   10, null,    2,
                       1, null,    9, null,    2,
                       1, null,    9, null,    4]
            },
            {
                number: 3,
                title: "Awards 'Numbers of Power' emblem.",
                description: "A wish for others to celebrate your success.",
                pattern: [
                       0, null,    0, null,    0,
                    null,    4, null,    4, null,
                       8, null,    8, null,    8,
                    null,   12, null,   12, null]
            },
            {
                number: 4,
                title: "Warp to second encounter (Shuro Chi).",
                description: "A wish to look athletic and elegant.",
                pattern: [
                      14,   15,   15,   15,   12,
                       6,   14,    4,   12,    6,
                       6,   12, null,   14,    6,
                      12,    5,    5,    5,   14]
            },
            {
                number: 5,
                title: "Warp to third encounter (Morgeth).",
                description: "A wish for a promising future.",
                pattern: [
                       4,   11,   14,   11,    4,
                    null,    8,   15,    8, null,
                    null,    8,   14,    8, null,
                       4,   11,   14,   11,    4]
            },
            {
                number: 6,
                title: "Warp to fourth encounter (The Vault).",
                description: "A wish to move the hands of time.",
                pattern: [
                       9,   12,   15,   12,    9,
                       0,    9, null,    9,    0,
                       0, null, null, null,    0,
                      10,   10,   10,   10,   10]
            },
            {
                number: 7,
                title: "Warp to final encounter (Riven).",
                description: "A wish to help a friend in need.",
                pattern: [
                      15,    3,   11, null,    5,
                       8, null, null,    6,   14,
                       8, null,   13,    6,   14,
                      15,    3,   11, null,    5]
            },
            {
                number: 8,
                title: "Plays song 'Hope for the Future'.",
                description: "A wish to stay here forever.",
                pattern: [
                    null,   11,   13,   10, null,
                    null,   11,   13,   10, null,
                    null,   11,   15,   10, null,
                    null,   11,   13,   10, null]
            },
            {
                number: 9,
                title: "Adds Failsafe voicelines to moments in the raid.",
                description: "A wish to stay here forever.",
                pattern: [
                    null, null, null, null, null,
                    null,    1,    1,    1, null,
                    null,    1,    1,   13, null,
                    null, null, null, null, null]
            },
            {
                number: 10,
                title: "Adds Drifter voicelines to moments in the raid.",
                description: "A wish to stay here forever.",
                pattern: [
                       1,    1, null, null,    1,
                       1,   11,   11, null,    3,
                       1, null,    6,    6,    3,
                    null, null, null,    3,    3]
            },
            {
                number: 11,
                title: "Grunt birthday party effect within the raid.",
                description: "A wish to stay here forever..",
                pattern: [
                      14,   14, null,   15,   15,
                      14, null,    1,    4,   15,
                      12, null,    1, null,    5,
                      12,   12, null,    5,    5]
            },
            {
                number: 12,
                title: "Adds unique effects to the heads of fireteam members.",
                description: "A wish to open your mind to new ideas.",
                pattern: [
                       0, null, null, null,    8,
                       0,    0,    8,    8,    8,
                       3,    3,   11,   14,   14,
                       3, null, null, null,   14]
            },
            {
                number: 13,
                title: "Unlocks 'Petra's Run' Version of the raid (Flawless Mode).",
                description: "A wish for the means to feed an addiction.",
                pattern: [
                      12,    1,   13,   14,    7,
                      12,    1, null,   14,    7,
                       7,   14, null,    1,   12,
                       7,   14, null,    1,   12]
            },
            {
                number: 14,
                title: "Spawns Ahamkara eggs throughout the raid.",
                description: "A wish for love and support.",
                pattern: [
                       4,    9,   13,    8,    4,
                    null, null,   15, null, null,
                       0, null,    5,    7, null,
                       4,   11, null, null,   10]
            },
            {
                number: 15,
                title: "The Unknown Wish",
                description: "'This one you shall cherish.' -- Riven of a Thousand Voices",
                pattern: [
                    null, null,   16, null, null,
                    null, null, null, null, null,
                      16, null, null, null,   16,
                    null, null, null,   16, null]
            }
        ];

        function WishingWall() {
            const [atlasLoaded, setAtlasLoaded] = useState(false);
            const [grid, setGrid] = useState(Array(20).fill(null));
            const atlasUrl = './DF54A880_fixed.png';

            useEffect(() => {
                const img = new Image();
                img.onload = () => setAtlasLoaded(true);
                img.src = atlasUrl;
            }, []);

            const getSymbolStyle = (symbol) => {
                // For a 4x4 atlas grid, each position needs to be calculated as:
                // (index / 3) * 100% to properly align
                const posX = (symbol.col / 3) * 100;
                const posY = (symbol.row / 3) * 100;
                
                return {
                    backgroundImage: `url(${atlasUrl})`,
                    backgroundSize: '400%',
                    backgroundPosition: `${posX}% ${posY}%`
                };
            };

            const handleGridClick = (index) => {
                const newGrid = [...grid];
                if (newGrid[index] === null) {
                    // If empty, set to first symbol
                    newGrid[index] = SYMBOLS[0];
                } else {
                    // Cycle to next symbol
                    const currentIndex = SYMBOLS.findIndex(s => s.id === newGrid[index].id);
                    const nextIndex = (currentIndex + 1) % SYMBOLS.length;
                    newGrid[index] = SYMBOLS[nextIndex];
                }
                setGrid(newGrid);
            };

            const handleGridRightClick = (e, index) => {
                e.preventDefault();
                const newGrid = [...grid];
                newGrid[index] = null;
                setGrid(newGrid);
            };

            const clearGrid = () => {
                setGrid(Array(20).fill(null));
            };

            const loadWish = (wish) => {
                if (wish.pattern) {
                    const newGrid = wish.pattern.map(symbolId => 
                        SYMBOLS.find(s => s.id === symbolId)
                    );
                    setGrid(newGrid);
                }
            };

            if (!atlasLoaded) {
                return (
                    <div className="loading-indicator">
                        <div className="spinner"></div>
                        <div style={{color: 'var(--primary)', fontFamily: 'Orbitron'}}>
                            INITIALIZING WISHING WALL...
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1 className="title">Wishing Wall</h1>
                        <p className="subtitle">Last Wish Raid • The Dreaming City</p>
                    </div>

                    <div className="main-content">
                        <div className="wall-section">
                            <h2 className="section-title">Wishing Wall Grid</h2>
                            <p className="instruction-text">
                                Click cells to cycle through symbols • Right-click to clear a cell • Click a wish to load its pattern
                            </p>
                            <div className="wishing-grid">
                                {grid.map((symbol, index) => (
                                    <div 
                                        key={index}
                                        className={`grid-cell ${symbol ? 'active' : ''}`}
                                        onClick={() => handleGridClick(index)}
                                        onContextMenu={(e) => handleGridRightClick(e, index)}
                                        title={symbol ? symbol.name : 'Click to cycle symbols'}
                                    >
                                        {symbol && (
                                            <div className="symbol-display" style={getSymbolStyle(symbol)}></div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="controls">
                                <button className="reset-button" onClick={clearGrid}>
                                    Reset
                                </button>
                            </div>
                        </div>

                        <div className="wishes-list">
                            <h2 className="section-title">Known Wishes</h2>
                            {WISHES.map(wish => (
                                <div 
                                    key={wish.number}
                                    className="wish-item"
                                    onClick={() => loadWish(wish)}
                                >
                                    <div className="wish-header">
                                        <span className="wish-number">WISH {wish.number}</span>
                                    </div>
                                    <div className="wish-title">
                                        {wish.number === 15 ? 
                                            <span className="mystery">{wish.title}</span> : 
                                            wish.title
                                        }
                                    </div>
                                    <div className="wish-description">{wish.description}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<WishingWall />, document.getElementById('root'));
    </script>
</body>
</html>
